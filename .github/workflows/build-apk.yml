name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Built entirely on this runner with Gradle: no Expo account, EAS or secrets needed.
    timeout-minutes: 90
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # node:sqlite in tests needs >= 22.5
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Advisory: expo-doctor compares against what the SDK expects today, so it can go red unprompted.
      - name: Check Expo project (advisory)
        run: npm run doctor
        continue-on-error: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Generates /android from app.json (never committed).
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Signed with the fixed key the generated project ships with (android/app/debug.keystore), so every
      # APK has the same signature and installs over the last one. Fine for a personal, sideloaded app;
      # switching to a private key later means uninstalling once.
      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx4g
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../learn-language.apk
          test -s ../learn-language.apk

      - name: Read the app version
        id: version
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      # Convenience copy; may fail on artifact quota. The Release below is the real output.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: learn-language-apk
          path: learn-language.apk
          retention-days: 14

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "v${{ steps.version.outputs.version }} · build #${{ github.run_number }}"
          body: "Learn Language v${{ steps.version.outputs.version }}. Download learn-language.apk on the phone and install it."
          files: learn-language.apk
